<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM</title><style>body{font:16px system-ui;max-width:720px;margin:auto;padding:16px;background:#f1f5f9}section{background:white;padding:16px;border-radius:12px;margin:12px 0}input,textarea,button{padding:10px;margin:4px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#0f766e;color:white}.item{padding:10px;border-bottom:1px solid #e2e8f0}</style><h1>💬 Внутренняя CRM</h1><section><input id="token" placeholder="Складской токен" type="password"><button onclick="load()">Войти</button><button onclick="localStorage.removeItem('crm_token');location.reload()">Выйти</button></section><section><h2>📊 Сводка</h2><div id="summary">—</div></section><section><h2>📣 Кампании</h2><input id="campaign-filter" placeholder="Фильтр статуса"><input id="campaign-name" placeholder="Название кампании"><input id="campaign-channels" placeholder="telegram,vk,avito"><button onclick="createCampaign()">Создать</button><div id="campaigns"></div></section><section><h2>Контент на проверке</h2><input id="job-filter" placeholder="Фильтр статуса"><button onclick="loadJobs()">Обновить</button><div id="jobs"></div></section><section><h2>Задачи</h2><input id="title" placeholder="Новая задача"><input id="description" placeholder="Описание"><input id="due" type="date"><select id="assignee"><option value="">Без ответственного</option></select><select id="priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="urgent">Срочный</option></select><button onclick="addTask()">Добавить</button><div id="tasks"></div></section><section><h2>💬 Чат <select id="channel"><option value="general">Общий</option><option value="warehouse">Склад</option><option value="sales">Продажи</option></select></h2><div id="messages"></div><textarea id="body" placeholder="Сообщение"></textarea><button onclick="send()">Отправить</button></section><script>
let token=localStorage.crm_token||'';token&&(document.querySelector('#token').value=token);const h=()=>({'Content-Type':'application/json','X-Wh-Token':token});async function load(){token=document.querySelector('#token').value.trim();localStorage.crm_token=token;const [t,m,u]=await Promise.all([fetch('/api/crm/tasks',{headers:h()}),fetch('/api/crm/messages?channel='+encodeURIComponent(channel.value),{headers:h()}),fetch('/api/warehouse/users',{headers:h()})]); if(u.ok){const us=await u.json();assignee.innerHTML='<option value=\"\">Без ответственного</option>'+us.map(x=>`<option value=\"${x.id}\">${x.name}</option>`).join('')} if(!t.ok) return alert('Нет доступа');render(await t.json(),await m.json())}function render(t,m){tasks.innerHTML=t.map(x=>`<div class=item><b>${x.title}</b><br><small>${x.description||''} · срок: ${x.due_at||'не задан'} · ответственный: ${x.assignee_id||'—'}</small><br><select onchange="status(${x.id},this.value)"><option ${x.status==='open'?'selected':''}>open</option><option ${x.status==='in_progress'?'selected':''}>in_progress</option><option ${x.status==='done'?'selected':''}>done</option></select> · ${x.priority}</div>`).join('');messages.innerHTML=m.map(x=>`<div class=item>${x.sender_id}: ${x.body}</div>`).join('')}async function addTask(){await fetch('/api/crm/tasks',{method:'POST',headers:h(),body:JSON.stringify({title:title.value,description:description.value,assignee_id:assignee.value||null,priority:priority.value,due_at:due.value})});title.value='';load()}async function status(id,v){await fetch('/api/crm/tasks/'+id,{method:'PUT',headers:h(),body:JSON.stringify({status:v})});load()}async function setCampaignStatus(id,status){await fetch('/api/marketing/campaigns/'+id,{method:'PUT',headers:h(),body:JSON.stringify({status})});loadCampaigns()}async function approveDraft(id){const r=await fetch('/api/marketing/campaigns/'+id+'/publications',{headers:h()});const a=await r.json();if(!a.length)return alert('Сначала подготовьте публикацию');await fetch('/api/marketing/publications/'+a[0].id,{method:'PUT',headers:h(),body:JSON.stringify({status:'approved'})});alert('Одобрено');}async function publishDraft(id){const ch=document.querySelector('#ch-'+id).value;await fetch('/api/marketing/campaigns/'+id+'/publications',{method:'POST',headers:h(),body:JSON.stringify({channel:ch})});alert('Публикация подготовлена')}async function loadSummary(){const r=await fetch('/api/marketing/summary',{headers:h()});if(r.ok){const x=await r.json();summary.textContent='Кампании: '+JSON.stringify(x.campaigns)+' · Публикации: '+JSON.stringify(x.publications)+' · Контент: '+JSON.stringify(x.content_jobs)}}async function createCampaign(){await fetch('/api/marketing/campaigns',{method:'POST',headers:h(),body:JSON.stringify({name:campaignName.value,channels:campaignChannels.value.split(',').map(x=>x.trim()).filter(Boolean)})});campaignName.value='';loadCampaigns()}async function loadCampaigns(){const r=await fetch('/api/marketing/campaigns',{headers:h()});if(!r.ok)return;campaigns.innerHTML=(await r.json()).filter(x=>!(campaignFilter.value||'').trim()||x.status.includes(campaignFilter.value.trim())).map(x=>`<div class=item><b>${x.name}</b> · ${x.status} · ${x.channels.join(', ')} <select id=\"ch-${x.id}\">${x.channels.map(c=>`<option>${c}</option>`).join('')}</select><button onclick=\"publishDraft(${x.id})\">Подготовить</button><button onclick=\"approveDraft(${x.id})\">Одобрить последнюю</button><button onclick=\"setCampaignStatus(${x.id},'active')\">Активировать</button><button onclick=\"setCampaignStatus(${x.id},'paused')\">Пауза</button></div>`).join('')}async function loadJobs(){const r=await fetch('/api/content/jobs',{headers:h()});if(!r.ok)return;const j=await r.json();const f=(jobFilter.value||'').trim().toLowerCase();jobs.innerHTML=j.filter(x=>!f||x.status.toLowerCase().includes(f)).map(x=>`<div class=item>job ${x.id} · ${x.status} · ${x.result_url||'ожидает результата'} ${x.status==='failed'?`<button onclick=\"retryJob(${x.id})\">Повторить</button>`:''}${x.status==='review'?`<button onclick=\"approve(${x.id},'approved')\">Одобрить</button><button onclick=\"approve(${x.id},'rejected')\">Отклонить</button>`:''}</div>`).join('')}async function retryJob(id){await fetch('/api/content/jobs/'+id+'/retry',{method:'POST',headers:h()});loadJobs()}async function approve(id,status){await fetch('/api/content/jobs/'+id+'/approve',{method:'POST',headers:h(),body:JSON.stringify({status})});loadJobs()}setInterval(()=>{if(token){load();loadJobs();loadCampaigns();loadSummary()}},30000);async function send(){await fetch('/api/crm/messages',{method:'POST',headers:h(),body:JSON.stringify({body:body.value,channel:channel.value})});body.value='';load()} 
</script>
