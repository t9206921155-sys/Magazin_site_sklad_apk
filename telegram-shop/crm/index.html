<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM</title><style>body{font:16px system-ui;max-width:720px;margin:auto;padding:16px;background:#f1f5f9}section{background:white;padding:16px;border-radius:12px;margin:12px 0}input,textarea,button{padding:10px;margin:4px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#0f766e;color:white}.item{padding:10px;border-bottom:1px solid #e2e8f0}</style><h1>💬 Внутренняя CRM</h1><section><input id="token" placeholder="Складской токен" type="password"><button onclick="load()">Войти</button></section><section><h2>Задачи</h2><input id="title" placeholder="Новая задача"><input id="due" type="date"><select id="assignee"><option value="">Без ответственного</option></select><select id="priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="urgent">Срочный</option></select><button onclick="addTask()">Добавить</button><div id="tasks"></div></section><section><h2>💬 Чат <select id="channel"><option value="general">Общий</option><option value="warehouse">Склад</option><option value="sales">Продажи</option></select></h2><div id="messages"></div><textarea id="body" placeholder="Сообщение"></textarea><button onclick="send()">Отправить</button></section><script>
let token=localStorage.crm_token||'';token&&(document.querySelector('#token').value=token);const h=()=>({'Content-Type':'application/json','X-Wh-Token':token});async function load(){token=document.querySelector('#token').value.trim();localStorage.crm_token=token;const [t,m,u]=await Promise.all([fetch('/api/crm/tasks',{headers:h()}),fetch('/api/crm/messages?channel='+encodeURIComponent(channel.value),{headers:h()}),fetch('/api/warehouse/users',{headers:h()})]); if(u.ok){const us=await u.json();assignee.innerHTML='<option value=\"\">Без ответственного</option>'+us.map(x=>`<option value=\"${x.id}\">${x.name}</option>`).join('')} if(!t.ok) return alert('Нет доступа');render(await t.json(),await m.json())}function render(t,m){tasks.innerHTML=t.map(x=>`<div class=item><b>${x.title}</b> · <select onchange="status(${x.id},this.value)"><option ${x.status==='open'?'selected':''}>open</option><option ${x.status==='in_progress'?'selected':''}>in_progress</option><option ${x.status==='done'?'selected':''}>done</option></select> · ${x.priority}</div>`).join('');messages.innerHTML=m.map(x=>`<div class=item>${x.sender_id}: ${x.body}</div>`).join('')}async function addTask(){await fetch('/api/crm/tasks',{method:'POST',headers:h(),body:JSON.stringify({title:title.value,assignee_id:assignee.value||null,priority:priority.value,due_at:due.value})});title.value='';load()}async function status(id,v){await fetch('/api/crm/tasks/'+id,{method:'PUT',headers:h(),body:JSON.stringify({status:v})});load()}async function send(){await fetch('/api/crm/messages',{method:'POST',headers:h(),body:JSON.stringify({body:body.value,channel:channel.value})});body.value='';load()} 
</script>
