services:
  shop:
    build: .
    container_name: telegram-shop
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Для больших каталогов можно увеличить лимит памяти Python:
    # environment:
    #   - PYTHONUNBUFFERED=1
