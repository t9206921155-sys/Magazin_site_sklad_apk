<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран настройки — приложение «Склад»</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { width:390px; height:844px; background:#fff; display:flex; flex-direction:column; }
  .status { height:44px; background:#0B5C55; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:13px; }
  .wrap { padding:24px; display:flex; flex-direction:column; flex:1; }
  .logo { width:64px; height:64px; border-radius:16px; background:#0F766E; display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:16px; }
  h1 { font-size:28px; color:#0F766E; font-weight:700; }
  .sub { font-size:14px; color:#666; margin-top:2px; margin-bottom:32px; }
  label { font-size:14px; font-weight:700; color:#111; }
  input { margin-top:8px; width:100%; height:52px; border:none; border-bottom:2px solid #0F766E; background:#F4F6F6; border-radius:8px 8px 0 0; padding:0 14px; font-size:15px; color:#111; outline:none; }
  .err { display:none; color:#C33; font-size:13px; margin-top:8px; }
  .btn { margin-top:24px; width:100%; height:48px; background:#0F766E; color:#fff; font-size:16px; font-weight:600; border:none; border-radius:8px; box-shadow:0 2px 6px rgba(15,118,110,.4); }
  .hint { margin-top:20px; font-size:12px; color:#888; line-height:1.5; }
  .nav { height:48px; background:#fff; border-top:1px solid #E5E5E5; display:flex; justify-content:space-around; align-items:center; }
  .nav span { width:8px; height:8px; background:#0F766E; border-radius:50%; }
</style>
</head>
<body>
  <div class="status"><span>09:41</span><span>▲ 🔋 5G</span></div>
  <div class="wrap">
    <div class="logo">📦</div>
    <h1>Склад</h1>
    <div class="sub">Telegram Shop • мобильный учёт товаров</div>
    <label>Адрес сервера</label>
    <input value="https://myshop.ru/warehouse/" readonly>
    <div class="btn" style="text-align:center;line-height:48px">Подключиться</div>
    <div class="hint">Если путь не указан — добавится /warehouse/.<br>Подключение к складу теперь находится в настройках APK.</div>
  </div>
  <div class="nav"><span></span><span style="opacity:.3"></span><span style="opacity:.3"></span></div>
</body>
</html>
