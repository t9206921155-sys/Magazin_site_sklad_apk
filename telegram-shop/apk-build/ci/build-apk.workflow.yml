name: build-apk

# Блок 26 (Sklad 1.1.0): сборка Android-релиза «Склад» (APK + AAB) на раннере GitHub Actions.
# В dev-песочнице нет доступа к dl.google.com / services.gradle.org — там сборка не выполняется.
# Готовые артефакты коммитятся обратно в ветку (permissions: contents: write)
# и отдаются сервером: /apk/Sklad-1.1.0-release.apk, /download/android, /api/releases/android.
on:
  workflow_dispatch:
  push:
    paths:
      - "telegram-shop/apk-build/**"
      - "telegram-shop/warehouse/**"

# Поднимаем права GITHUB_TOKEN: по умолчанию в репо read-only,
# поэтому пуш артефактов из run-tests.sh получал 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK + AAB
        run: |
          cd telegram-shop/apk-build
          ./rebuild-apk.sh

      - name: Commit artifacts back to branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add telegram-shop/apk/Sklad-*-release.apk telegram-shop/aab/Sklad-*-release.aab
          if git diff --cached --quiet; then
            echo "Артефакты не изменились — пропуск"
          else
            git commit -m "CI: артефакты Sklad (APK+AAB)"
            git push
          fi

      - name: Upload artifacts (history)
        uses: actions/upload-artifact@v4
        with:
          name: sklad-release
          path: |
            telegram-shop/apk/Sklad-*-release.apk
            telegram-shop/aab/Sklad-*-release.aab
          if-no-files-found: error
